name: Deploy to Firebase

# Runs on every push to main, or manually from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      APP_URL: ${{ secrets.APP_URL }}
      HAS_VOICE: ${{ secrets.LIVEKIT_API_SECRET != '' && secrets.VOICE_WORKER_SECRET != '' && secrets.DEEPGRAM_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check required secrets
        run: |
          missing=""
          for s in FIREBASE_PROJECT_ID FIREBASE_SERVICE_ACCOUNT VITE_FIREBASE_API_KEY VITE_FIREBASE_APP_ID ENCRYPTION_KEY; do
            [ -z "${!s}" ] && missing="$missing $s"
          done
          if [ -n "$missing" ]; then echo "::error::Missing GitHub secrets:$missing"; exit 1; fi
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}

      - name: Write web config (.env)
        run: |
          cat > .env <<ENV
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${PROJECT_ID}.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=${PROJECT_ID}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || format('{0}.firebasestorage.app', secrets.FIREBASE_PROJECT_ID) }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_ENABLE_GOOGLE_SIGNIN=true
          ENV

      - name: Typecheck and test
        run: |
          pnpm -r typecheck
          npx -y firebase-tools@14 emulators:exec --only auth --project demo-zdoda "pnpm --filter @zdoda/functions test"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Sync server secrets to Secret Manager
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          VOICE_WORKER_SECRET: ${{ secrets.VOICE_WORKER_SECRET }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RECORDING_GCP_CREDENTIALS: ${{ secrets.RECORDING_GCP_CREDENTIALS }}
        run: |
          used=""
          for s in ENCRYPTION_KEY ANTHROPIC_API_KEY OPENAI_API_KEY GEMINI_API_KEY STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET RESEND_API_KEY LIVEKIT_API_SECRET VOICE_WORKER_SECRET TWILIO_AUTH_TOKEN META_APP_SECRET RAZORPAY_KEY_SECRET RAZORPAY_WEBHOOK_SECRET GOOGLE_CLIENT_SECRET RECORDING_GCP_CREDENTIALS; do
            if [ -n "${!s}" ]; then
              printf '%s' "${!s}" | npx -y firebase-tools@14 functions:secrets:set "$s" --data-file=- --project "$PROJECT_ID" --force --non-interactive
              used="$used,$s"
            fi
          done
          echo "ZDODA_SECRETS=${used#,}" >> "$GITHUB_ENV"

      - name: Sync voice worker secrets
        if: ${{ env.HAS_VOICE == 'true' }}
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
        run: |
          for s in DEEPGRAM_API_KEY ELEVENLABS_API_KEY CARTESIA_API_KEY; do
            if [ -n "${!s}" ]; then printf '%s' "${!s}" | npx -y firebase-tools@14 functions:secrets:set "$s" --data-file=- --project "$PROJECT_ID" --force --non-interactive; echo "$s" >> .voice-secrets; fi
          done
          # AI keys already synced above are shared with the worker
          for s in ANTHROPIC_API_KEY OPENAI_API_KEY GEMINI_API_KEY; do
            case ",$ZDODA_SECRETS," in *",$s,"*) echo "$s" >> .voice-secrets;; esac
          done

      - name: Write server config (apps/functions/.env)
        run: |
          URL="${APP_URL:-https://${PROJECT_ID}.web.app}"
          cat > apps/functions/.env <<ENV
          WEB_APP_URL=${URL}
          CORS_ALLOWED_ORIGINS=${URL},https://${PROJECT_ID}.web.app,https://${PROJECT_ID}.firebaseapp.com
          ZDODA_SECRETS=${ZDODA_SECRETS}
          LLM_PROVIDER=auto
          EMBEDDING_PROVIDER=auto
          STRIPE_PRICE_STARTER_MONTHLY=${{ secrets.STRIPE_PRICE_STARTER_MONTHLY }}
          STRIPE_PRICE_STARTER_YEARLY=${{ secrets.STRIPE_PRICE_STARTER_YEARLY }}
          STRIPE_PRICE_PRO_MONTHLY=${{ secrets.STRIPE_PRICE_PRO_MONTHLY }}
          STRIPE_PRICE_PRO_YEARLY=${{ secrets.STRIPE_PRICE_PRO_YEARLY }}
          STRIPE_PRICE_BUSINESS_MONTHLY=${{ secrets.STRIPE_PRICE_BUSINESS_MONTHLY }}
          STRIPE_PRICE_BUSINESS_YEARLY=${{ secrets.STRIPE_PRICE_BUSINESS_YEARLY }}
          EMAIL_FROM=Zdoda <noreply@zdoda.com>
          LIVEKIT_URL=${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY=${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_SIP_URI=${{ secrets.LIVEKIT_SIP_URI }}
          TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
          WHATSAPP_VERIFY_TOKEN=${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_PLAN_STARTER=${{ secrets.RAZORPAY_PLAN_STARTER }}
          RAZORPAY_PLAN_PRO=${{ secrets.RAZORPAY_PLAN_PRO }}
          RAZORPAY_PLAN_BUSINESS=${{ secrets.RAZORPAY_PLAN_BUSINESS }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          RECORDING_GCS_BUCKET=${{ secrets.RECORDING_GCS_BUCKET }}
          SUPERADMIN_EMAILS=${{ secrets.SUPERADMIN_EMAILS }}
          ENV
          # Empty values would override defaults — drop them.
          sed -i '/=$/d' apps/functions/.env

      - name: Deploy (rules, indexes, functions, hosting)
        run: npx -y firebase-tools@14 deploy --only firestore,storage,functions,hosting --project "$PROJECT_ID" --non-interactive --force

      - name: Deploy voice worker to Cloud Run
        if: ${{ env.HAS_VOICE == 'true' }}
        run: |
          gcloud config set project "$PROJECT_ID"
          gcloud services enable run.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com --quiet
          URL="${APP_URL:-https://${PROJECT_ID}.web.app}"
          gcloud run deploy zdoda-voice --source apps/voice --region us-central1 --quiet \
            --min-instances 1 --no-cpu-throttling --cpu 2 --memory 4Gi --no-allow-unauthenticated \
            --set-env-vars "ZDODA_API_URL=${URL},LIVEKIT_URL=${{ secrets.LIVEKIT_URL }},LIVEKIT_API_KEY=${{ secrets.LIVEKIT_API_KEY }}" \
            --set-secrets "LIVEKIT_API_SECRET=LIVEKIT_API_SECRET:latest,VOICE_WORKER_SECRET=VOICE_WORKER_SECRET:latest,$(./.github/voice-secrets.sh)"

      - name: Summary
        run: echo "Deployed to ${APP_URL:-https://${PROJECT_ID}.web.app}" >> "$GITHUB_STEP_SUMMARY"
